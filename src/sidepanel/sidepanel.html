<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Docs Paper Copilot</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header>
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
        <line x1="16" y1="13" x2="8" y2="13"></line>
        <line x1="16" y1="17" x2="8" y2="17"></line>
        <polyline points="10 9 9 9 8 9"></polyline>
      </svg>
      <span>Paper Copilot</span>
    </div>
    <nav class="nav-tabs">
      <button class="tab-btn active" data-tab="tab-editor">Editor</button>
      <button class="tab-btn" data-tab="tab-diff">Diff</button>
      <button class="tab-btn" data-tab="tab-settings">Pengaturan</button>
    </nav>
  </header>

  <main>
    <!-- TAB 1: EDITOR -->
    <div id="tab-editor" class="tab-content">
      <div class="section-label">Mode Penyempurnaan</div>
      <div class="action-grid">
        <button class="action-card active" data-action="puebi">
          <div class="action-title">PUEBI & Ejaan</div>
          <div class="action-desc">Koreksi typo, tanda baca, kapitalisasi baku.</div>
        </button>
        <button class="action-card" data-action="paraphrase">
          <div class="action-title">Parafrase Ilmiah</div>
          <div class="action-desc">Tingkatkan register akademik dan kalimat pasif.</div>
        </button>
        <button class="action-card" data-action="plagiarism">
          <div class="action-title">Reduksi Plagiasi</div>
          <div class="action-desc">Ubah struktur klausa tanpa ubah substansi.</div>
        </button>
        <button class="action-card" data-action="citation">
          <div class="action-title">Format Sitasi</div>
          <div class="action-desc">Standardisasi APA 7th / IEEE references.</div>
        </button>
      </div>

      <div style="margin-top: 14px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
          <span class="section-label" style="margin-bottom: 0;">Teks Input</span>
          <button id="btn-sync-selection" class="secondary-btn" style="padding: 3px 8px; font-size: 11px;">Ambil Seleksi Docs</button>
        </div>
        <textarea id="input-text" rows="5" placeholder="Pilih teks di Google Docs atau ketik di sini..."></textarea>
      </div>

      <div style="margin-top: 12px;">
        <button id="btn-run-process" class="primary-btn">
          <span>Jalankan Perbaikan AI</span>
        </button>
      </div>

      <div style="margin-top: 14px;">
        <div class="section-label">Hasil Revisi</div>
        <textarea id="output-text" rows="5" readonly placeholder="Hasil revisi teks akan muncul di sini..."></textarea>
        <div style="display: flex; gap: 8px; margin-top: 8px;">
          <button id="btn-apply-docs" class="primary-btn" style="flex: 2;">Terapkan ke Google Docs</button>
          <button id="btn-copy-result" class="secondary-btn" style="flex: 1;">Salin Teks</button>
        </div>
      </div>
    </div>

    <!-- TAB 2: DIFF -->
    <div id="tab-diff" class="tab-content" style="display: none;">
      <div class="section-label">Perbandingan Teks (Sebelum vs Sesudah)</div>
      <div id="diff-container" class="diff-box">Belum ada revisi yang diproses. Jalankan perbaikan di tab Editor.</div>
      <div style="margin-top: 10px; font-size: 11px; color: var(--text-muted); display: flex; gap: 12px;">
        <span><span class="diff-tag diff-added">+ Hijau</span> : Penambahan kata</span>
        <span><span class="diff-tag diff-removed">- Merah</span> : Pengurangan/koreksi kata</span>
      </div>
    </div>

    <!-- TAB 3: SETTINGS -->
    <div id="tab-settings" class="tab-content" style="display: none;">
      <div class="section-label">Konfigurasi Model AI</div>
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <div>
          <label class="section-label">Provider AI</label>
          <select id="setting-provider">
            <option value="gemini">Google Gemini (Disarankan)</option>
            <option value="openai">OpenAI</option>
          </select>
        </div>
        <div>
          <label class="section-label">API Key</label>
          <input type="password" id="setting-apikey" placeholder="Masukkan API Key...">
        </div>
        <div>
          <label class="section-label">Model Engine</label>
          <input type="text" id="setting-model" value="gemini-2.5-flash" placeholder="e.g. gemini-2.5-flash, gemini-2.5-pro">
        </div>
        <div>
          <button id="btn-save-settings" class="primary-btn" style="margin-top: 6px;">Simpan Pengaturan</button>
        </div>
      </div>
    </div>
  </main>

  <footer class="status-bar">
    <span id="status-text">Siap melayani koreksi dokumen.</span>
    <span id="doc-sync-status">Docs terhubung</span>
  </footer>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
