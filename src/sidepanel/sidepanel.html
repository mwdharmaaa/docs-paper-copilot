<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ask Gemini - Google Docs</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <!-- Header -->
  <header class="gemini-header">
    <div class="brand-group">
      <svg class="gemini-sparkle-icon" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2L14.4 9.6L22 12L14.4 14.4L12 22L9.6 14.4L2 12L9.6 9.6L12 2Z"/>
      </svg>
      <div>
        <div class="brand-title">Gemini</div>
        <div class="brand-sub">Google Docs Assistant</div>
      </div>
    </div>
    <div class="header-actions">
      <button id="btn-toggle-context" class="context-pill" title="Status konteks dokumen">
        <span class="context-dot"></span>
        <span id="doc-title-label">Dokumen Terhubung</span>
      </button>
      <button id="btn-open-settings" class="icon-btn" title="Pengaturan API">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- Settings Panel (Collapsible) -->
  <section id="settings-drawer" class="settings-drawer" style="display: none;">
    <div class="settings-header">
      <span>Pengaturan Model & Kunci API</span>
      <button id="btn-close-settings" class="close-btn">&times;</button>
    </div>
    <div class="settings-field">
      <label>Google Gemini API Key</label>
      <input type="password" id="setting-apikey" placeholder="Masukkan Gemini API Key...">
    </div>
    <div class="settings-row">
      <div class="settings-field" style="flex: 1;">
        <label>Model</label>
        <select id="setting-model">
          <option value="gemini-3.5-flash-lite" selected>Gemini 3.5 Flash Lite (Respon Kilat ~1s)</option>
          <option value="gemini-3.8-flash">Gemini 3.8 Flash (Komprehensif)</option>
          <option value="gemini-3.8-pro">Gemini 3.8 Pro (Maksimal)</option>
        </select>
      </div>
      <div class="settings-field" style="flex: 1;">
        <label>Kecepatan Ngetik</label>
        <select id="setting-speed">
          <option value="12">Super Cepat (12ms)</option>
          <option value="20" selected>Alami (20ms)</option>
          <option value="35">Santai (35ms)</option>
        </select>
      </div>
    </div>
    <button id="btn-save-settings" class="save-btn">Simpan Pengaturan</button>
  </section>

  <!-- Chat / Interaction Feed -->
  <main id="chat-feed" class="chat-feed">
    <!-- Welcome Hero Card (Shown on Empty State) -->
    <div id="welcome-card" class="welcome-card">
      <div class="welcome-icon-box">
        <svg class="welcome-sparkle" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2L14.4 9.6L22 12L14.4 14.4L12 22L9.6 14.4L2 12L9.6 9.6L12 2Z"/>
        </svg>
      </div>
      <h2>Apa yang ingin kamu tulis hari ini?</h2>
      <p>Tanya apa saja tentang dokumen ini, buat draf tulisan baru, atau minta Gemini mengetik otomatis langsung ke Google Docs.</p>

      <div class="suggestions-grid">
        <button class="suggestion-chip" data-prompt="Bantu tulis paragraf pembuka tentang dampak AI">Bantu tulis draf pembuka</button>
        <button class="suggestion-chip" data-prompt="Ringkas poin-poin utama dari isi dokumen ini">Ringkas dokumen</button>
        <button class="suggestion-chip" data-prompt="Perbaiki ejaan, typo, dan tata bahasa teks seleksi sesuai PUEBI">Perbaiki ejaan & PUEBI</button>
        <button class="suggestion-chip" data-prompt="Kembangkan argumen ini menjadi analisis mendalam">Kembangkan argumen</button>
      </div>
    </div>

    <!-- Messages Container -->
    <div id="messages-list" class="messages-list"></div>
  </main>

  <!-- Bottom Input Bar -->
  <footer class="input-container">
    <div id="selection-bar" class="selection-pill-bar" style="display: none;">
      <span class="selection-badge">Konteks Seleksi Terdeteksi</span>
      <span id="selection-preview" class="selection-preview-text"></span>
      <button id="btn-clear-selection" class="selection-clear" title="Hapus konteks seleksi">&times;</button>
    </div>

    <div class="prompt-box">
      <textarea id="prompt-input" rows="1" placeholder="Tanya Gemini atau instruksikan menulis..."></textarea>
      <button id="btn-send-prompt" class="send-btn" title="Kirim instruksi">
        <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </div>
    <div class="input-footer">
      <span id="footer-status">Tekan Enter untuk kirim, Shift+Enter untuk baris baru.</span>
      <button id="btn-clear-chat" class="text-link-btn">Bersihkan Chat</button>
    </div>
  </footer>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
